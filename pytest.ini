[pytest]
pythonpath = .
testpaths = tests
addopts =
    --import-mode=importlib
    -ra
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
markers =
    ui: tests that open a browser
    smoke: valid login and a completed checkout
    login: authentication scenarios
    inventory: catalog sorting
    cart: cart badge, contents, and removal
    checkout: checkout form and purchase
